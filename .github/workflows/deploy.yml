name: Deploy GitHub Pages with Python

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-running: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. SETUP PYTHON
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 2. INSTALL LIBRARY (Jika script Python Anda butuh modul tambahan, misal: feedparser, beautifulsoup4, dll)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Atau install manual jika butuh modul spesifik:
          # pip install feedparser beautifulsoup4

      # 3. JALANKAN SCRIPT PYTHON (Contoh: inject_ads.py atau script generator Anda)
      - name: Run Python Script
        run: |
          python inject_ads.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
